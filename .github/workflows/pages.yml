name: Deploy quiz to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build static site
        env:
          SUPABASE_FUNCTION_URL: ${{ vars.SUPABASE_FUNCTION_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_FUNCTION_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::Shared score storage is not configured. The quiz will deploy, but scores will not be shared until both Supabase repository variables are set."
          fi
          mkdir dist
          cp index.html app.js questions.js styles.css dist/
          node -e 'require("node:fs").writeFileSync("dist/quiz-config.js", "window.QUIZ_CONFIG = " + JSON.stringify({submitUrl: process.env.SUPABASE_FUNCTION_URL, anonKey: process.env.SUPABASE_ANON_KEY}) + ";\n")'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4