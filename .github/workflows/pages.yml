name: Deploy quiz to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build static site
        env:
          SUPABASE_FUNCTION_URL: ${{ vars.SUPABASE_FUNCTION_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_FUNCTION_URL" || (echo "Set the SUPABASE_FUNCTION_URL repository variable." && exit 1)
          test -n "$SUPABASE_ANON_KEY" || (echo "Set the SUPABASE_ANON_KEY repository variable." && exit 1)
          mkdir dist
          cp index.html app.js questions.js styles.css dist/
          node -e 'require("node:fs").writeFileSync("dist/quiz-config.js", "window.QUIZ_CONFIG = " + JSON.stringify({submitUrl: process.env.SUPABASE_FUNCTION_URL, anonKey: process.env.SUPABASE_ANON_KEY}) + ";\n")'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4